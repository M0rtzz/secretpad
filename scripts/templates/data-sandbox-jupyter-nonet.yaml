apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-jupyter-nonet
spec:
  deployTemplates:
    - name: jupyter
      replicas: 1
      spec:
        containers:
          - command:
              - start-notebook.sh
              - --ServerApp.ip=0.0.0.0
              - --ServerApp.port=8888
              - --ServerApp.token=
              - --ServerApp.password=
              - --no-browser
              - --NotebookApp.allow_origin=*
            name: jupyter
            # NO_NETWORK 隔离变体：无 scope=Cluster 端口（不产生集群外可达端点），
            # 探针降级为端口级（TCP），避免 HTTP 就绪检查依赖外网可达性。
            ports:
              - name: web
                port: 8888
                protocol: HTTP
                scope: Domain
            readinessProbe:
              tcpSocket:
                port: web
            livenessProbe:
              tcpSocket:
                port: web
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: web
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /home/jovyan
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
