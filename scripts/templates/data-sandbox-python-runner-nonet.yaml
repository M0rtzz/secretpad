# Z-05 Python 计算任务运行组件隔离对照变体：py 端口 scope=Cluster → Domain，
# Kuscia 不分配集群外可达端点，平台无法经 gateway 取回结果（不可达证明，供 E2E 对照）。
apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-python-runner-nonet
spec:
  configTemplates:
    pyConf: |-
      {"task_input_config": "{{.TASK_INPUT_CONFIG}}"}
  deployTemplates:
    - name: python-runner
      replicas: 1
      spec:
        containers:
          - command:
              - sh
              - -c
              - "python /app/python_runner.py --config /etc/kuscia/py-conf.json"
            configVolumeMounts:
              - mountPath: /etc/kuscia/py-conf.json
                subPath: pyConf
            name: python-runner
            ports:
              - name: py
                port: 8000
                protocol: HTTP
                scope: Domain        # 隔离变体：无 Cluster 端点 = 平台不可达
            readinessProbe:
              tcpSocket:
                port: py
            livenessProbe:
              tcpSocket:
                port: py
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: py
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /app
        restartPolicy: Never
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
