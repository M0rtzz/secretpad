# Z-05 JAR 计算任务运行组件 AppImage：一次性 Kuscia Job + scope=Cluster 结果取回端口。
# 输入数据 + JAR 字节经 task_input_config（configTemplates 挂载为 /etc/kuscia/jar-conf.json）携带，
# 平台侧 DevJobExecutor 以 createJob(task_input_config=...) 下发（exec_type=JAR）；
# 容器内 jar_runner.py 解码 -> 写 app.jar + input.csv + params.json -> java -jar 执行 -> 常驻 :8000 提供 /result。
apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-jar-runner
spec:
  configTemplates:
    jarConf: |-
      {"task_input_config": "{{.TASK_INPUT_CONFIG}}"}
  deployTemplates:
    - name: jar-runner
      replicas: 1
      spec:
        containers:
          - command:
              - sh
              - -c
              - "python /app/jar_runner.py --config /etc/kuscia/jar-conf.json"
            configVolumeMounts:
              - mountPath: /etc/kuscia/jar-conf.json
                subPath: jarConf
            name: jar-runner
            ports:
              - name: jar
                port: 8000
                protocol: HTTP
                scope: Cluster        # 结果取回通道：平台经 secretpad.gateway Host 头路由访问
            # 常驻服务：java -jar 先于 serve_forever 同步执行，失败则容器退出 -> Job Failed
            readinessProbe:
              tcpSocket:
                port: jar
            livenessProbe:
              tcpSocket:
                port: jar
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: jar
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /app
        restartPolicy: Never
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
