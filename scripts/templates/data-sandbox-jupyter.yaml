apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-jupyter
spec:
  deployTemplates:
    - name: jupyter
      replicas: 1
      spec:
        containers:
          - command:
              - start-notebook.sh
              - --ServerApp.ip=0.0.0.0
              - --ServerApp.port=8888
              - --ServerApp.token=
              - --ServerApp.password=
              - --no-browser
              - --NotebookApp.allow_origin=*
            name: jupyter
            # scope=Cluster 的端口由 Kuscia 分配集群外可达地址并回填 endpoints，
            # 沙箱状态同步据此写入 ds_sandbox.endpoint（开发端点跳板的数据来源）。
            # 容器内不设 Jupyter token：Kuscia 集群内可达，鉴权全部收敛在 SecretPad 跳板层。
            ports:
              - name: web
                port: 8888
                protocol: HTTP
                scope: Cluster
            readinessProbe:
              httpGet:
                path: /api/status
                port: web
            livenessProbe:
              httpGet:
                path: /api/status
                port: web
            startupProbe:
              failureThreshold: 60
              httpGet:
                path: /api/status
                port: web
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /home/jovyan
  image:
    id: 0
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
