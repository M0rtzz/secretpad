# Z-04 自定义代码执行隔离对照变体：sampler 端口 scope=Cluster → Domain，
# Kuscia 不分配集群外可达端点，平台无法经 gateway 取回结果（不可达证明，供 E2E 对照）。
apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-sampler-nonet
spec:
  configTemplates:
    samplerConf: |-
      {"task_input_config": "{{.TASK_INPUT_CONFIG}}"}
  deployTemplates:
    - name: sampler
      replicas: 1
      spec:
        containers:
          - command:
              - sh
              - -c
              - "python /app/sampler_server.py --config /etc/kuscia/sampler-conf.json"
            configVolumeMounts:
              - mountPath: /etc/kuscia/sampler-conf.json
                subPath: samplerConf
            name: sampler
            ports:
              - name: sampler
                port: 8000
                protocol: HTTP
                scope: Domain        # 隔离变体：无 Cluster 端点 = 平台不可达
            readinessProbe:
              tcpSocket:
                port: sampler
            livenessProbe:
              tcpSocket:
                port: sampler
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: sampler
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /app
        restartPolicy: Never
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
