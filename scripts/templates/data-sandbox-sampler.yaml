# Z-04 自定义代码执行 AppImage：一次性 Kuscia Job + scope=Cluster 结果取回端口。
# 输入数据经 task_input_config（configTemplates 挂载为 /etc/kuscia/sampler-conf.json）
# 携带，平台侧 GovernanceCustomExecutor 以 createJob(task_input_config=...) 下发；
# 容器内 sampler_server.py 解码 → 执行用户脚本 → 常驻 :8000 提供 /result。
apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-sampler
spec:
  configTemplates:
    samplerConf: |-
      {"task_input_config": "{{.TASK_INPUT_CONFIG}}"}
  deployTemplates:
    - name: sampler
      replicas: 1
      spec:
        containers:
          - command:
              - sh
              - -c
              - "python /app/sampler_server.py --config /etc/kuscia/sampler-conf.json"
            configVolumeMounts:
              - mountPath: /etc/kuscia/sampler-conf.json
                subPath: samplerConf
            name: sampler
            ports:
              - name: sampler
                port: 8000
                protocol: HTTP
                scope: Cluster        # 结果取回通道：平台经 secretpad.gateway Host 头路由访问
            # 常驻服务：脚本先于 serve_forever 同步执行，失败则容器退出 → Job Failed
            readinessProbe:
              tcpSocket:
                port: sampler
            livenessProbe:
              tcpSocket:
                port: sampler
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: sampler
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /app
        restartPolicy: Never
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
