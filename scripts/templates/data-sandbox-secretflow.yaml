apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-secretflow
spec:
  deployTemplates:
    - name: secretflow
      replicas: 1
      spec:
        containers:
          - command:
              - sh
              - -c
              - "ray start --head --port=6379 --dashboard-port=8265 >/dev/null 2>&1 || true; exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token= --ServerApp.password= --NotebookApp.allow_origin=*"
            name: secretflow
            ports:
              - name: web
                port: 8888
                protocol: HTTP
                scope: Cluster
              - name: ray-head
                port: 6379
                protocol: HTTP
                scope: Domain
              - name: ray-dashboard
                port: 8265
                protocol: HTTP
                scope: Domain
            # jupyter 就绪前仅做端口级探测，避免镜像缺 jupyter 时沙箱永远起不来
            readinessProbe:
              tcpSocket:
                port: web
            livenessProbe:
              tcpSocket:
                port: web
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: web
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /root
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
