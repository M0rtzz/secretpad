apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-secretflow
spec:
  deployTemplates:
    - name: secretflow
      replicas: 1
      spec:
        containers:
          # 端口同 jupyter：监听 kuscia 分配的 KUSCIA_PORT_WEB_NUMBER（默认 8888）。
          # secretflow-anolis8 镜像无 jupyter（有 ray/python3），故有 jupyter 则用
          # jupyter lab，否则降级为 python3 http.server 兜底，保证容器常驻且探针可连通。
          - command:
              - sh
              - -c
              - >-
                ray start --head
                --port="${KUSCIA_PORT_RAY_HEAD_NUMBER:-6379}"
                --dashboard-port="${KUSCIA_PORT_RAY_DASHBOARD_NUMBER:-8265}"
                >/tmp/ray-start.log 2>&1 || true;
                sandbox_id="${HOSTNAME#ds-}";
                sandbox_id="${sandbox_id%-task-server-0}";
                mkdir -p /workspace;
                cd /workspace;
                PORT="${KUSCIA_PORT_WEB_NUMBER:-8888}";
                if command -v jupyter >/dev/null 2>&1; then
                  exec jupyter lab --ip=0.0.0.0 --port="$PORT"
                  --ServerApp.base_url="/api/v1alpha1/data-sandbox/proxy/${sandbox_id}/"
                  --ServerApp.root_dir=/workspace
                  --ServerApp.token=
                  --ServerApp.password=
                  --ServerApp.allow_origin=*
                  --no-browser
                  --allow-root;
                else
                  exec python3 -m http.server "$PORT" --bind 0.0.0.0;
                fi
            name: secretflow
            ports:
              - name: web
                port: 8888
                protocol: HTTP
                scope: Cluster
              - name: ray-head
                port: 6379
                protocol: HTTP
                scope: Domain
              - name: ray-dashboard
                port: 8265
                protocol: HTTP
                scope: Domain
            # jupyter 就绪前仅做端口级探测，避免镜像缺 jupyter 时沙箱永远起不来
            readinessProbe:
              tcpSocket:
                port: web
            livenessProbe:
              tcpSocket:
                port: web
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: web
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /root
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
