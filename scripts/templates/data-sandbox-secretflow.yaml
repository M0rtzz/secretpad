apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-secretflow
spec:
  deployTemplates:
    - name: secretflow
      replicas: 1
      spec:
        containers:
          - command:
              - sh
              - -c
              - >-
                sandbox_id="${HOSTNAME#ds-}";
                sandbox_id="${sandbox_id%-task-server-0}";
                mkdir -p /workspace;
                cd /workspace;
                ray start --head
                --port="${KUSCIA_PORT_RAY_HEAD_NUMBER:-6379}"
                --dashboard-port="${KUSCIA_PORT_RAY_DASHBOARD_NUMBER:-8265}"
                >/tmp/ray-start.log 2>&1 || true;
                exec jupyter lab
                --ServerApp.ip=0.0.0.0
                --ServerApp.port="${KUSCIA_PORT_WEB_NUMBER:-8888}"
                --ServerApp.base_url="/api/v1alpha1/data-sandbox/proxy/${sandbox_id}/"
                --ServerApp.root_dir=/workspace
                --ServerApp.token=
                --ServerApp.password=
                --ServerApp.allow_origin=*
                --no-browser
                --allow-root
            name: secretflow
            ports:
              - name: web
                port: 8888
                protocol: HTTP
                scope: Cluster
              - name: ray-head
                port: 6379
                protocol: HTTP
                scope: Domain
              - name: ray-dashboard
                port: 8265
                protocol: HTTP
                scope: Domain
            # jupyter 就绪前仅做端口级探测，避免镜像缺 jupyter 时沙箱永远起不来
            readinessProbe:
              tcpSocket:
                port: web
            livenessProbe:
              tcpSocket:
                port: web
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: web
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /root
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
