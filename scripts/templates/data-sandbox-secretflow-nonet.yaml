apiVersion: kuscia.secretflow/v1alpha1
kind: AppImage
metadata:
  name: data-sandbox-secretflow-nonet
spec:
  deployTemplates:
    - name: secretflow
      replicas: 1
      spec:
        containers:
          # 与 base 变体同款弹性命令：ray 失败不阻断、jupyter 缺失降级 python3 http.server，
          # 保证容器常驻且探针可连通；监听 kuscia 分配的 KUSCIA_PORT_WEB_NUMBER（默认 8888）。
          - command:
              - sh
              - -c
              - "ray start --head --port=6379 --dashboard-port=8265 >/dev/null 2>&1 || true; PORT=${KUSCIA_PORT_WEB_NUMBER:-8888}; if command -v jupyter >/dev/null 2>&1; then exec jupyter lab --ip=0.0.0.0 --port=$PORT --no-browser --allow-root --ServerApp.token= --ServerApp.password= --NotebookApp.allow_origin=*; else exec python3 -m http.server $PORT --bind 0.0.0.0; fi"
            name: secretflow
            # NO_NETWORK 隔离变体：web 端口 scope=Cluster → Domain，Kuscia 不分配集群外端点。
            ports:
              - name: web
                port: 8888
                protocol: HTTP
                scope: Domain
              - name: ray-head
                port: 6379
                protocol: HTTP
                scope: Domain
              - name: ray-dashboard
                port: 8265
                protocol: HTTP
                scope: Domain
            readinessProbe:
              tcpSocket:
                port: web
            livenessProbe:
              tcpSocket:
                port: web
            startupProbe:
              failureThreshold: 60
              tcpSocket:
                port: web
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            workingDir: /root
  image:
    id: "{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
    name: {{.IMAGE_NAME}}
    sign: ""
    tag: {{.IMAGE_TAG}}
